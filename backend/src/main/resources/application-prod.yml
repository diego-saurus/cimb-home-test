spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

cimb:
  cors:
    # Override via the CORS_ALLOWED_ORIGINS env var in production (comma-separated).
    allowed-origins: []

logging:
  level:
    root: INFO
    dev.diegosaurus.cimb.callmonitoring: INFO
